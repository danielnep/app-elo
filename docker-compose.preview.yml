name: app-elo-preview
services:
  preview:
    image: nginx:1.27-alpine
    container_name: app-elo-preview
    restart: unless-stopped
    networks:
      - coolify
    volumes:
      - /opt/app-elo/app/build/web:/usr/share/nginx/html:ro
      - /opt/app-elo/preview/default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.app-elo-preview.rule=Host(`elo.hzsys.tech`)"
      - "traefik.http.routers.app-elo-preview.entrypoints=https"
      - "traefik.http.routers.app-elo-preview.tls=true"
      - "traefik.http.routers.app-elo-preview.tls.certresolver=letsencrypt"
      - "traefik.http.services.app-elo-preview.loadbalancer.server.port=80"
      - "traefik.http.routers.app-elo-http.rule=Host(`elo.hzsys.tech`)"
      - "traefik.http.routers.app-elo-http.entrypoints=http"
      - "traefik.http.routers.app-elo-http.middlewares=app-elo-redirect-https"
      - "traefik.http.routers.app-elo-http.service=app-elo-preview"
      - "traefik.http.middlewares.app-elo-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.app-elo-redirect-https.redirectscheme.permanent=true"
    security_opt:
      - no-new-privileges:true
networks:
  coolify:
    external: true
